<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>JYM & WTF</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+SC:wght@200;300;400;600&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:#0c0a0f;color:#e8e0d8;font-family:'Cormorant Garamond','Noto Serif SC',serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── Loading ─────────────────── */
#loader{position:fixed;inset:0;z-index:9999;background:#0c0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 2s cubic-bezier(.4,0,.2,1),visibility 2s}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader .l-line{width:1px;height:0;background:linear-gradient(to bottom,transparent,#c9a87c,transparent);transition:height 2s cubic-bezier(.4,0,.2,1)}
#loader .l-line.grow{height:120px}
#loader .l-text{margin-top:40px;font-size:11px;letter-spacing:8px;color:rgba(201,168,124,0.4);text-transform:uppercase;opacity:0;transition:opacity 1.5s 0.5s}
#loader .l-text.show{opacity:1}

/* ── BGM Button ──────────────── */
#bgm-btn{position:fixed;bottom:30px;right:30px;z-index:50;width:40px;height:40px;border:1px solid rgba(201,168,124,0.15);border-radius:50%;background:rgba(12,10,15,0.6);backdrop-filter:blur(10px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.4s;opacity:0;pointer-events:none}
#bgm-btn.show{opacity:1;pointer-events:auto}
#bgm-btn:hover{border-color:rgba(201,168,124,0.4);transform:scale(1.1)}
#bgm-btn svg{width:16px;height:16px;fill:rgba(201,168,124,0.5);transition:fill 0.3s}
#bgm-btn:hover svg{fill:rgba(201,168,124,0.8)}
#bgm-btn .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
#bgm-btn .bar{width:2px;background:rgba(201,168,124,0.5);border-radius:1px;animation:none}
#bgm-btn.playing .bar{animation:bounce 0.8s ease-in-out infinite alternate}
#bgm-btn .bar:nth-child(1){height:4px;animation-delay:0s}
#bgm-btn .bar:nth-child(2){height:8px;animation-delay:0.1s}
#bgm-btn .bar:nth-child(3){height:12px;animation-delay:0.2s}
#bgm-btn .bar:nth-child(4){height:6px;animation-delay:0.3s}
@keyframes bounce{0%{height:3px}100%{height:14px}}

/* ── Global ──────────────────── */
canvas{position:fixed;inset:0;z-index:1;display:block}
.overlay{position:fixed;inset:0;z-index:2;pointer-events:none}

/* ── Progress Bar (top) ──────── */
.progress-track{position:fixed;top:0;left:0;right:0;height:1px;z-index:30;background:rgba(255,255,255,0.03)}
.progress-fill{height:100%;width:0;background:rgba(201,168,124,0.3);transition:width 0.15s}

/* ── Fixed Brand ─────────────── */
.brand{position:fixed;top:28px;left:32px;z-index:20;pointer-events:none}
.brand-name{font-size:13px;letter-spacing:10px;color:rgba(201,168,124,0.4);font-weight:300}
.brand-sub{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,0.12);margin-top:4px}

/* ── Fixed Scroll Cue ────────── */
.scroll-cue{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;text-align:center;opacity:1;transition:opacity 0.6s}
.scroll-cue .sc-line{width:1px;height:28px;background:linear-gradient(to bottom,rgba(201,168,124,0.25),transparent);margin:0 auto;animation:cueFloat 3s ease-in-out infinite}
.scroll-cue .sc-text{font-size:8px;letter-spacing:5px;color:rgba(255,255,255,0.1);margin-top:10px;text-transform:uppercase}
@keyframes cueFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ── Content Layer ───────────── */
.content{position:relative;z-index:5;pointer-events:none}
.content *{pointer-events:auto}

/* ── Section ─────────────────── */
.section{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 40px;position:relative}

/* ── Intro ───────────────────── */
.intro{text-align:center}
.intro .year{font-size:clamp(60px,12vw,140px);font-weight:300;color:rgba(201,168,124,0.04);letter-spacing:15px;line-height:1;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}
.intro h1{font-size:clamp(28px,5vw,52px);font-weight:300;color:rgba(255,255,255,0.85);letter-spacing:6px;line-height:1.8}
.intro h1 em{font-style:italic;color:rgba(201,168,124,0.7)}
.intro .sub{font-size:11px;letter-spacing:5px;color:rgba(255,255,255,0.15);margin-top:28px;text-transform:uppercase}
.intro .divider{width:1px;height:40px;background:linear-gradient(to bottom,rgba(201,168,124,0.2),transparent);margin:32px auto 0}

/* ── Gallery ─────────────────── */
.gallery-wrap{width:100%;max-width:1100px}
.gallery-row{display:flex;gap:20px;margin-bottom:20px;justify-content:center}
.gallery-row.reverse{flex-direction:row-reverse}

.photo{position:relative;overflow:hidden;cursor:pointer;flex-shrink:0}
.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(30%) brightness(0.85);transition:all 1.2s cubic-bezier(.23,1,.32,1)}
.photo:hover img{filter:grayscale(0%) brightness(1);transform:scale(1.04)}
.photo .ph-border{position:absolute;inset:0;border:1px solid rgba(201,168,124,0.08);pointer-events:none;transition:border-color 0.6s}
.photo:hover .ph-border{border-color:rgba(201,168,124,0.2)}
.photo .ph-num{position:absolute;top:14px;left:14px;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.15);font-family:'Cormorant Garamond',serif}

/* Sizes */
.photo.tall{width:240px;height:340px}
.photo.wide{width:380px;height:260px}
.photo.square{width:260px;height:260px}
.photo.medium{width:280px;height:360px}

@media(max-width:768px){
  .gallery-row{flex-direction:column;align-items:center;gap:16px}
  .gallery-row.reverse{flex-direction:column}
  .photo.tall,.photo.wide,.photo.square,.photo.medium{width:85vw;height:auto;aspect-ratio:auto}
  .photo.tall{aspect-ratio:3/4}
  .photo.wide{aspect-ratio:16/10}
  .photo.square{aspect-ratio:1}
  .photo.medium{aspect-ratio:3/4}
}

/* ── Poetry Section ──────────── */
.poetry{text-align:center;position:relative;padding:120px 40px}
.poetry .p-bg{font-size:clamp(80px,15vw,180px);font-weight:300;color:rgba(201,168,124,0.025);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;letter-spacing:20px}
.poetry .p-line{font-size:clamp(16px,2.5vw,24px);font-weight:300;color:rgba(255,255,255,0.5);line-height:2.8;letter-spacing:3px}
.poetry .p-line em{font-style:italic;color:rgba(201,168,124,0.5)}
.poetry .p-note{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.1);margin-top:40px;text-transform:uppercase}

/* ── Ending ──────────────────── */
.ending{text-align:center}
.ending h2{font-size:clamp(32px,6vw,64px);font-weight:300;color:rgba(255,255,255,0.7);letter-spacing:8px;line-height:1.8}
.ending h2 span{color:rgba(201,168,124,0.6)}
.ending .end-line{width:40px;height:1px;background:rgba(201,168,124,0.2);margin:40px auto}
.ending .end-sub{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.12);line-height:2.2}

/* ── Photo Modal ─────────────── */
#modal{position:fixed;inset:0;z-index:100;background:rgba(12,10,15,0.95);backdrop-filter:blur(40px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all 0.7s cubic-bezier(.23,1,.32,1);cursor:pointer}
#modal.open{opacity:1;visibility:visible}
#modal img{max-width:80vw;max-height:80vh;object-fit:contain;transform:scale(0.92);transition:transform 0.7s cubic-bezier(.23,1,.32,1);border-radius:2px}
#modal.open img{transform:scale(1)}
#modal .m-cap{text-align:center;margin-top:24px;position:absolute;bottom:max(5vh,30px);left:50%;transform:translateX(-50%)}
#modal .m-cap h3{font-size:18px;font-weight:300;letter-spacing:4px;color:rgba(255,255,255,0.6)}
#modal .m-cap p{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.15);margin-top:8px}

/* ── Fade-in animation ───────── */
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1.2s cubic-bezier(.23,1,.32,1),transform 1.2s cubic-bezier(.23,1,.32,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-delay-1{transition-delay:0.15s}
.reveal-delay-2{transition-delay:0.3s}
.reveal-delay-3{transition-delay:0.45s}
.reveal-delay-4{transition-delay:0.6s}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ═══════ BGM ═══════ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx, gainNode, bgmPlaying = false;
const bgmBtn = document.getElementById('bgm-btn');

function createBGM() {
  audioCtx = new AudioCtx();
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0;
  gainNode.connect(audioCtx.destination);

  // Gentle piano-like chords with reverb feel
  const notes = [
    // C major 7 voicing
    [261.63, 329.63, 392.00, 493.88],
    // Am7
    [220.00, 261.63, 329.63, 392.00],
    // F major 7
    [174.61, 220.00, 261.63, 349.23],
    // G
    [196.00, 246.94, 293.66, 392.00],
  ];
  const durations = [4, 4, 4, 4];
  let time = audioCtx.currentTime + 0.1;

  function playChord(freqs, dur, t) {
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      // Add slight detune for warmth
      osc.detune.value = (Math.random() - 0.5) * 8;
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.04, t + 0.8);
      env.gain.exponentialRampToValueAtTime(0.015, t + dur * 0.7);
      env.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(env);
      env.connect(gainNode);
      osc.start(t);
      osc.stop(t + dur + 0.1);
    });
    // Add a high shimmer
    const shimmer = audioCtx.createOscillator();
    const shimEnv = audioCtx.createGain();
    shimmer.type = 'sine';
    shimmer.frequency.value = freqs[freqs.length - 1] * 2;
    shimEnv.gain.setValueAtTime(0, t);
    shimEnv.gain.linearRampToValueAtTime(0.008, t + 1);
    shimEnv.gain.exponentialRampToValueAtTime(0.001, t + dur);
    shimmer.connect(shimEnv);
    shimEnv.connect(gainNode);
    shimmer.start(t);
    shimmer.stop(t + dur + 0.1);
  }

  function scheduleLoop() {
    if (!bgmPlaying) return;
    const now = audioCtx.currentTime;
    if (time < now + 2) {
      for (let i = 0; i < notes.length; i++) {
        playChord(notes[i], durations[i], time);
        time += durations[i];
      }
    }
    setTimeout(scheduleLoop, 2000);
  }

  bgmPlaying = true;
  gainNode.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 3);
  scheduleLoop();
  bgmBtn.classList.add('playing');
}

bgmBtn.addEventListener('click', () => {
  if (!audioCtx) { createBGM(); return; }
  if (bgmPlaying) {
    bgmPlaying = false;
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
    bgmBtn.classList.remove('playing');
  } else {
    bgmPlaying = true;
    gainNode.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 2);
    bgmBtn.classList.add('playing');
    // Resume scheduling
    setTimeout(function loop() {
      if (!bgmPlaying) return;
      const now = audioCtx.currentTime;
      const notes = [
        [261.63, 329.63, 392.00, 493.88],
        [220.00, 261.63, 329.63, 392.00],
        [174.61, 220.00, 261.63, 349.23],
        [196.00, 246.94, 293.66, 392.00],
      ];
      notes.forEach((freqs, i) => {
        freqs.forEach(f => {
          const osc = audioCtx.createOscillator();
          const env = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          osc.detune.value = (Math.random() - 0.5) * 8;
          const t = now + i * 4;
          env.gain.setValueAtTime(0, t);
          env.gain.linearRampToValueAtTime(0.04, t + 0.8);
          env.gain.exponentialRampToValueAtTime(0.015, t + 2.8);
          env.gain.exponentialRampToValueAtTime(0.001, t + 4);
          osc.connect(env);
          env.connect(gainNode);
          osc.start(t);
          osc.stop(t + 4.1);
        });
      });
      setTimeout(loop, 14000);
    }, 2000);
  }
});

/* ═══════ THREE.JS ═══════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0a0f);
scene.fog = new THREE.FogExp2(0x0c0a0f, 0.008);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 4, 20);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.3, 0.5, 0.9);
composer.addPass(bloom);

// Lights — warm, soft, romantic
scene.add(new THREE.AmbientLight(0x1a0f15, 0.4));
const warm = new THREE.DirectionalLight(0xffeedd, 0.3);
warm.position.set(3, 10, 5);
scene.add(warm);
const pink = new THREE.PointLight(0xc9a87c, 1.2, 40);
pink.position.set(-5, 6, 0);
scene.add(pink);
const rose = new THREE.PointLight(0xff91a4, 0.8, 30);
rose.position.set(5, 4, -10);
scene.add(rose);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x0f0d12, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
scene.add(ground);

// Subtle path
const pathPts = [];
for (let i = 0; i < 80; i++) pathPts.push(new THREE.Vector3(Math.sin(i * 0.08) * 3, 0.01, -i * 1.2));
const pathCurve = new THREE.CatmullRomCurve3(pathPts);
scene.add(new THREE.Mesh(
  new THREE.TubeGeometry(pathCurve, 200, 0.4, 6, false),
  new THREE.MeshStandardMaterial({ color: 0x161118, roughness: 0.85, emissive: 0x0a0808, emissiveIntensity: 0.1 })
));

// Trees
function createTree(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  // Trunk
  const tc = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0.1, 2.5, 0.05),
    new THREE.Vector3(-0.05, 5, -0.03),
    new THREE.Vector3(0.08, 7, 0.02),
    new THREE.Vector3(0, 8.5, 0)
  ]);
  g.add(new THREE.Mesh(
    new THREE.TubeGeometry(tc, 16, 0.12, 6, false),
    new THREE.MeshStandardMaterial({ color: 0x2a1a15, roughness: 0.9 })
  ));
  // Blossoms — softer, more muted
  const colors = [0xc9a87c, 0xd4b896, 0xbf9e78, 0xdebfa5, 0xb8956e];
  for (let i = 0; i < 20; i++) {
    const geo = new THREE.SphereGeometry(0.6 + Math.random() * 1, 6, 5);
    const pos = geo.attributes.position;
    for (let j = 0; j < pos.count; j++) {
      const v = new THREE.Vector3().fromBufferAttribute(pos, j);
      v.x += (Math.random() - 0.5) * 0.3;
      v.y += (Math.random() - 0.5) * 0.2;
      v.z += (Math.random() - 0.5) * 0.3;
      pos.setXYZ(j, v.x, v.y, v.z);
    }
    const c = colors[Math.floor(Math.random() * colors.length)];
    g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: c, roughness: 0.8, transparent: true,
      opacity: 0.5 + Math.random() * 0.3,
      emissive: c, emissiveIntensity: 0.05
    })).translateX((Math.random() - 0.5) * 5).translateY(5 + Math.random() * 4).translateZ((Math.random() - 0.5) * 5));
  }
  scene.add(g);
}
createTree(-8, -8, 1.1);
createTree(6, -12, 0.8);
createTree(-12, -25, 1.0);
createTree(10, -22, 1.2);
createTree(-4, -38, 0.9);
createTree(14, -40, 1.0);
createTree(-10, -55, 1.1);
createTree(8, -60, 0.9);

// Floating petals — fewer, more elegant
const PC = 1500;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PC * 3);
const pVel = new Float32Array(PC * 3);
const pSz = new Float32Array(PC);
const pPh = new Float32Array(PC);
const pCl = new Float32Array(PC * 3);
const palette = [
  new THREE.Color(0xc9a87c),
  new THREE.Color(0xd4b896),
  new THREE.Color(0xbf9e78),
  new THREE.Color(0xdebfa5),
  new THREE.Color(0xb8956e),
];
for (let i = 0; i < PC; i++) {
  const i3 = i * 3;
  pPos[i3] = (Math.random() - 0.5) * 40;
  pPos[i3 + 1] = Math.random() * 18;
  pPos[i3 + 2] = Math.random() * -80;
  pVel[i3] = (Math.random() - 0.5) * 0.008;
  pVel[i3 + 1] = -0.005 - Math.random() * 0.01;
  pVel[i3 + 2] = (Math.random() - 0.5) * 0.005;
  pSz[i] = 2 + Math.random() * 4;
  pPh[i] = Math.random() * Math.PI * 2;
  const c = palette[Math.floor(Math.random() * palette.length)];
  pCl[i3] = c.r; pCl[i3 + 1] = c.g; pCl[i3 + 2] = c.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('size', new THREE.BufferAttribute(pSz, 1));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCl, 3));
const petalMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vC;
    varying float vA;
    void main(){
      vC = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (180.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vA = smoothstep(90.0, 10.0, -mv.z);
    }
  `,
  fragmentShader: `
    varying vec3 vC;
    varying float vA;
    void main(){
      vec2 u = gl_PointCoord - 0.5;
      float d = length(u);
      if(d > 0.5) discard;
      float a = smoothstep(0.5, 0.08, d) * vA * 0.45;
      gl_FragColor = vec4(vC, a);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
scene.add(new THREE.Points(pGeo, petalMat));

// Fireflies — golden, sparse
const FC = 80;
const fGeo = new THREE.BufferGeometry();
const fPos = new Float32Array(FC * 3);
const fSz = new Float32Array(FC);
for (let i = 0; i < FC; i++) {
  fPos[i * 3] = (Math.random() - 0.5) * 35;
  fPos[i * 3 + 1] = 1 + Math.random() * 8;
  fPos[i * 3 + 2] = Math.random() * -70;
  fSz[i] = 1 + Math.random() * 2;
}
fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
fGeo.setAttribute('size', new THREE.BufferAttribute(fSz, 1));
const ffMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float size;
    varying float vA;
    uniform float t;
    void main(){
      vec3 p = position;
      p.x += sin(t * 0.3 + position.z * 0.15) * 0.4;
      p.y += sin(t * 0.5 + position.x * 0.1) * 0.2;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = size * (120.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      float fl = sin(t * 2.0 + position.x * 6.0) * 0.5 + 0.5;
      vA = fl * smoothstep(60.0, 5.0, -mv.z) * 0.6;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float g = exp(-d * 8.0);
      vec3 c = mix(vec3(1.0, 0.85, 0.5), vec3(0.8, 0.7, 0.4), g);
      gl_FragColor = vec4(c, g * vA);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { t: { value: 0 } }
});
scene.add(new THREE.Points(fGeo, ffMat));

// Camera path
const camPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 4, 20),
  new THREE.Vector3(-1, 4.5, 10),
  new THREE.Vector3(0.5, 5, 0),
  new THREE.Vector3(-0.5, 4, -12),
  new THREE.Vector3(0.3, 5, -25),
  new THREE.Vector3(-0.8, 4.5, -38),
  new THREE.Vector3(0, 5.5, -50),
  new THREE.Vector3(0.5, 4, -62),
  new THREE.Vector3(-0.3, 5, -75),
]);

/* ═══════ SCROLL ═══════ */
const totalH = document.querySelector('.content').scrollHeight;
let progress = 0;
function updateScroll() {
  const max = totalH - window.innerHeight;
  progress = Math.max(0, Math.min(1, window.scrollY / max));
}
window.addEventListener('scroll', updateScroll, { passive: true });

// Progress bar
const progressEl = document.getElementById('progress');
// Scroll cue
const scrollCue = document.getElementById('scroll-cue');

/* ═══════ REVEAL ON SCROLL ═══════ */
const reveals = document.querySelectorAll('.reveal');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.15 });
reveals.forEach(el => observer.observe(el));

/* ═══════ PHOTO MODAL ═══════ */
const PHOTOS = [
  { src: 'photos/01.jpeg', title: '我们的剪影', desc: '夕阳下的轮廓' },
  { src: 'photos/02.jpeg', title: '城市与你', desc: '万家灯火' },
  { src: 'photos/03.jpeg', title: '花海', desc: '比花还美' },
  { src: 'photos/04.png', title: 'Cosmos', desc: '粉色心事' },
  { src: 'photos/06.png', title: '向阳', desc: '像阳光洒满大地' },
  { src: 'photos/07.jpeg', title: '毛孩子', desc: '我们的小可爱' },
  { src: 'photos/08.jpeg', title: '古韵', desc: '屋檐下的未来' },
  { src: 'photos/09.jpeg', title: '追光', desc: '追逐落日' },
  { src: 'photos/10.jpeg', title: '江畔', desc: '流过的时光' },
  { src: 'photos/11.jpeg', title: '秋千', desc: '荡进心里' },
];
const modal = document.getElementById('modal');
const mImg = document.getElementById('m-img');
const mTitle = document.getElementById('m-title');
const mDesc = document.getElementById('m-desc');
document.querySelectorAll('.photo').forEach(el => {
  el.addEventListener('click', e => {
    e.stopPropagation();
    const idx = parseInt(el.dataset.idx);
    const p = PHOTOS[idx];
    mImg.src = p.src;
    mTitle.textContent = p.title;
    mDesc.textContent = p.desc;
    modal.classList.add('open');
  });
});
modal.addEventListener('click', () => modal.classList.remove('open'));

/* ═══════ ANIMATE ═══════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Camera
  const cp = camPath.getPointAt(progress);
  const cl = camPath.getPointAt(Math.min(1, progress + 0.03));
  camera.position.lerp(cp, 0.03);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const tgt = cl.clone().sub(cp).normalize();
  dir.lerp(tgt, 0.03);
  camera.lookAt(camera.position.clone().add(dir.multiplyScalar(15)));

  // Petals
  const pp = pGeo.attributes.position.array;
  for (let i = 0; i < PC; i++) {
    const i3 = i * 3;
    pp[i3] += pVel[i3] + Math.sin(t * 0.3 + pPh[i]) * 0.002;
    pp[i3 + 1] += pVel[i3 + 1];
    pp[i3 + 2] += pVel[i3 + 2];
    if (pp[i3 + 1] < -1) {
      pp[i3] = (Math.random() - 0.5) * 40;
      pp[i3 + 1] = 15 + Math.random() * 5;
      pp[i3 + 2] = camera.position.z - 20 + Math.random() * -40;
    }
  }
  pGeo.attributes.position.needsUpdate = true;

  // Fireflies
  ffMat.uniforms.t.value = t;

  // Lights breathe
  pink.intensity = 1.2 + Math.sin(t * 0.3) * 0.3;
  rose.intensity = 0.8 + Math.sin(t * 0.4 + 1) * 0.2;

  // Bloom
  bloom.strength = 0.2 + progress * 0.4;

  // UI
  progressEl.style.width = (progress * 100) + '%';
  scrollCue.style.opacity = progress > 0.01 ? Math.max(0, 1 - progress * 30) : 1;

  composer.render();
}

/* ═══════ INIT ═══════ */
setTimeout(() => {
  document.getElementById('l-line').classList.add('grow');
  document.getElementById('l-text').classList.add('show');
}, 100);
setTimeout(() => {
  document.getElementById('loader').classList.add('done');
  bgmBtn.classList.add('show');
}, 2500);

updateScroll();
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
