<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ETERNAL BLOSSOMING</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;600&family=Inter:wght@200;300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#0a0008;color:#fff;font-family:'Inter','Noto Serif SC',sans-serif;overflow-x:hidden;cursor:default}
::selection{background:rgba(255,100,150,0.3)}
::-webkit-scrollbar{width:0;background:transparent}

/* ── Loading ─────────────────── */
#loader{position:fixed;inset:0;z-index:9999;background:#0a0008;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s,visibility 1.2s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
#loader .l-petals{position:absolute;width:100%;height:100%;overflow:hidden}
#loader .l-petal{position:absolute;width:12px;height:12px;background:radial-gradient(ellipse,rgba(255,180,200,0.8),rgba(255,120,160,0.2));border-radius:50% 0 50% 0;animation:petalFall linear infinite}
@keyframes petalFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
#loader .l-content{position:relative;z-index:2;text-align:center}
#loader .l-icon{font-size:48px;margin-bottom:30px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.8}50%{transform:scale(1.15);opacity:1}}
#loader .l-title{font-size:11px;letter-spacing:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:50px}
#loader .l-bar{width:240px;height:1px;background:rgba(255,255,255,0.08);overflow:hidden;border-radius:1px}
#loader .l-fill{width:0%;height:100%;background:linear-gradient(90deg,rgba(255,120,170,0.3),rgba(255,180,210,0.8),rgba(255,120,170,0.3));transition:width 0.3s;box-shadow:0 0 20px rgba(255,120,170,0.4)}
#loader .l-pct{margin-top:18px;font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:5px}

/* ── Canvas ──────────────────── */
#three-canvas{position:fixed;inset:0;z-index:1}

/* ── Scroll Container ────────── */
#scroll-container{position:relative;z-index:2;width:100%}

/* ── Fixed UI ────────────────── */
.ui-layer{position:fixed;z-index:10;pointer-events:none}
.brand{top:32px;left:40px}
.brand .logo{font-size:26px;font-weight:600;letter-spacing:10px;color:rgba(255,255,255,0.85);text-shadow:0 0 30px rgba(255,120,170,0.2)}
.brand .sub{font-size:9px;letter-spacing:5px;color:rgba(255,255,255,0.25);text-transform:uppercase;margin-top:6px}
.status{top:32px;right:40px;text-align:right}
.status .phase{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.35);text-transform:uppercase}
.status .progress{font-size:22px;font-weight:200;color:rgba(255,255,255,0.5);margin-top:4px;font-variant-numeric:tabular-nums}
.info-bl{bottom:40px;left:40px}
.info-bl .date{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.25);text-transform:uppercase}
.info-bl .desc{font-size:13px;color:rgba(255,255,255,0.4);margin-top:8px;max-width:300px;line-height:1.8;letter-spacing:1px}
.info-br{bottom:40px;right:40px;text-align:right}
.info-br .hint{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.15);text-transform:uppercase}

/* ── Center Text Overlay ─────── */
.center-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;pointer-events:none;text-align:center;opacity:0;transition:opacity 1s}
.center-text.show{opacity:1}
.center-text .ct-main{font-family:'Noto Serif SC',serif;font-size:clamp(28px,5vw,56px);font-weight:200;color:rgba(255,255,255,0.9);line-height:1.6;letter-spacing:4px;text-shadow:0 0 60px rgba(255,100,150,0.3)}
.center-text .ct-sub{font-size:11px;letter-spacing:6px;color:rgba(255,255,255,0.25);text-transform:uppercase;margin-top:20px}
.center-text .ct-en{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,0.15);text-transform:uppercase;margin-top:12px;font-style:italic}

/* ── Scroll Hint ─────────────── */
.scroll-hint{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;text-align:center;animation:scrollFloat 2.5s ease-in-out infinite}
.scroll-hint .sh-text{font-size:9px;letter-spacing:5px;color:rgba(255,255,255,0.2);text-transform:uppercase}
.scroll-hint .sh-line{width:1px;height:40px;background:linear-gradient(to bottom,rgba(255,180,200,0.4),transparent);margin:12px auto 0}
@keyframes scrollFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(10px)}}

/* ── Petal cursor trail ──────── */
.cursor-petal{position:fixed;pointer-events:none;z-index:9998;width:8px;height:8px;background:radial-gradient(ellipse,rgba(255,180,200,0.6),transparent);border-radius:50% 0 50% 0;animation:cursorFade 1.5s forwards}
@keyframes cursorFade{0%{transform:scale(1) rotate(0deg);opacity:1}100%{transform:scale(0) rotate(360deg) translateY(60px);opacity:0}}

/* ── Vignette ────────────────── */
.vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%)}
</style>
</head>
<body>

<!-- Loading -->
<div id="loader">
  <div class="l-petals" id="l-petals"></div>
  <div class="l-content">
    <div class="l-icon">🌸</div>
    <div class="l-title">ETERNAL BLOSSOMING</div>
    <div class="l-bar"><div class="l-fill" id="l-fill"></div></div>
    <div class="l-pct" id="l-pct">0%</div>
  </div>
</div>

<!-- 3D Canvas -->
<canvas id="three-canvas"></canvas>

<!-- Vignette overlay -->
<div class="vignette"></div>

<!-- Scroll Container -->
<div id="scroll-container"></div>

<!-- Fixed UI -->
<div class="ui-layer brand">
  <div class="logo">JYM & WTF</div>
  <div class="sub">ETERNAL BLOSSOMING · 365 DAY</div>
</div>
<div class="ui-layer status">
  <div class="phase" id="ui-phase">ARRIVAL</div>
  <div class="progress" id="ui-progress">0%</div>
</div>
<div class="ui-layer info-bl">
  <div class="date">CHERRY BLOSSOMS · FOREVER</div>
  <div class="desc" id="ui-desc"></div>
</div>
<div class="ui-layer info-br">
  <div class="hint">SCROLL TO EXPLORE</div>
</div>

<!-- Center text -->
<div class="center-text" id="center-text">
  <div class="ct-main" id="ct-main"></div>
  <div class="ct-sub" id="ct-sub"></div>
  <div class="ct-en" id="ct-en"></div>
</div>

<!-- Scroll hint -->
<div class="scroll-hint" id="scroll-hint">
  <div class="sh-text">SCROLL TO SHAPE THE BLOSSOMING</div>
  <div class="sh-line"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ══════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════ */
const SECTIONS = [
  { phase:'ARRIVAL', title:'在最初', sub:'是种子', en:'In the beginning was the Seed', desc:'万物始于一粒微小的种子，沉睡在大地的怀抱中。' },
  { phase:'ROOTS', title:'扎根', sub:'向深处', en:'Roots Take Hold', desc:'根系在黑暗中延伸，汲取生命的养分。' },
  { phase:'GROWTH', title:'生长', sub:'向天空', en:'Reaching for the Light', desc:'枝干向着阳光伸展，每一片叶子都在诉说生命的故事。' },
  { phase:'BLOSSOM', title:'花开', sub:'满园春', en:'The Garden in Full Bloom', desc:'万千花瓣在风中起舞，整个世界都沉浸在这永恒的绽放中。' },
  { phase:'ETERNAL', title:'永恒', sub:'这一刻', en:'This Moment, Forever', desc:'花开一瞬，却美了整个永恒。' },
];
const SECTION_HEIGHT = window.innerHeight * 2.5;
const TOTAL_HEIGHT = SECTION_HEIGHT * SECTIONS.length;

/* ══════════════════════════════════════════
   LOADING ANIMATION
   ══════════════════════════════════════════ */
const petalsContainer = document.getElementById('l-petals');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'l-petal';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = (3 + Math.random() * 4) + 's';
  p.style.animationDelay = Math.random() * 5 + 's';
  p.style.width = (6 + Math.random() * 10) + 'px';
  p.style.height = p.style.width;
  petalsContainer.appendChild(p);
}

/* ══════════════════════════════════════════
   THREE.JS SETUP
   ══════════════════════════════════════════ */
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0008);
scene.fog = new THREE.FogExp2(0x0a0008, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 3, 12);

/* ── Post Processing ── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85);
bloomPass.threshold = 0.3;
bloomPass.strength = 0.7;
bloomPass.radius = 0.5;
composer.addPass(bloomPass);

/* ── Lights ── */
const ambientLight = new THREE.AmbientLight(0x331122, 0.5);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xffeedd, 0.6);
moonLight.position.set(5, 15, 5);
scene.add(moonLight);

const pinkLight = new THREE.PointLight(0xff6090, 2, 30);
pinkLight.position.set(-3, 5, 0);
scene.add(pinkLight);

const warmLight = new THREE.PointLight(0xffaa44, 1.5, 25);
warmLight.position.set(4, 3, -3);
scene.add(warmLight);

/* ══════════════════════════════════════════
   CHERRY BLOSSOM TREES
   ══════════════════════════════════════════ */
function createTree(x, z, scale=1) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.scale.setScalar(scale);

  // Trunk - curved
  const trunkCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0.2, 2, 0.1),
    new THREE.Vector3(-0.1, 4, -0.1),
    new THREE.Vector3(0.15, 6, 0.05),
    new THREE.Vector3(0, 7.5, 0),
  ]);
  const trunkGeo = new THREE.TubeGeometry(trunkCurve, 20, 0.15, 8, false);
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x4a2820, roughness:0.9, metalness:0.05 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  group.add(trunk);

  // Branches
  const branchMat = new THREE.MeshStandardMaterial({ color:0x5a3028, roughness:0.85 });
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 + Math.random() * 0.5;
    const len = 1.5 + Math.random() * 2;
    const startY = 3 + Math.random() * 3.5;
    const branchCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, startY, 0),
      new THREE.Vector3(Math.cos(angle)*len*0.5, startY+0.5, Math.sin(angle)*len*0.5),
      new THREE.Vector3(Math.cos(angle)*len, startY+1+Math.random(), Math.sin(angle)*len),
    ]);
    const branchGeo = new THREE.TubeGeometry(branchCurve, 10, 0.06, 6, false);
    group.add(new THREE.Mesh(branchGeo, branchMat));
  }

  // Blossom canopy - multiple clusters
  const blossomColors = [0xffb7c5, 0xff91a4, 0xffc0cb, 0xff69b4, 0xffd1dc];
  for (let i = 0; i < 25; i++) {
    const bx = (Math.random()-0.5) * 5;
    const by = 5 + Math.random() * 4;
    const bz = (Math.random()-0.5) * 5;
    const bRadius = 0.8 + Math.random() * 1.2;
    const blossomGeo = new THREE.SphereGeometry(bRadius, 8, 6);
    // Deform for organic look
    const pos = blossomGeo.attributes.position;
    for (let j = 0; j < pos.count; j++) {
      const v = new THREE.Vector3().fromBufferAttribute(pos, j);
      v.x += (Math.random()-0.5) * 0.4;
      v.y += (Math.random()-0.5) * 0.3;
      v.z += (Math.random()-0.5) * 0.4;
      pos.setXYZ(j, v.x, v.y, v.z);
    }
    const color = blossomColors[Math.floor(Math.random()*blossomColors.length)];
    const blossomMat = new THREE.MeshStandardMaterial({
      color, roughness:0.7, metalness:0.05,
      transparent:true, opacity:0.7 + Math.random()*0.3,
      emissive: color, emissiveIntensity:0.15,
    });
    const blossom = new THREE.Mesh(blossomGeo, blossomMat);
    blossom.position.set(bx, by, bz);
    group.add(blossom);
  }

  scene.add(group);
  return group;
}

// Create trees
const trees = [];
trees.push(createTree(-6, -5, 1.2));
trees.push(createTree(5, -8, 0.9));
trees.push(createTree(-10, -15, 1.0));
trees.push(createTree(8, -12, 1.1));
trees.push(createTree(-3, -25, 1.3));
trees.push(createTree(12, -20, 0.8));
trees.push(createTree(-8, -35, 1.0));
trees.push(createTree(6, -40, 1.2));
trees.push(createTree(-12, -50, 0.9));
trees.push(createTree(10, -55, 1.1));

/* ══════════════════════════════════════════
   GROUND PLANE
   ══════════════════════════════════════════ */
const groundGeo = new THREE.PlaneGeometry(100, 200, 50, 100);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1a0a12, roughness:0.95, metalness:0.0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.1;
ground.position.z = -50;
scene.add(ground);

/* ── Path ── */
const pathPoints = [];
for (let i = 0; i < 60; i++) {
  pathPoints.push(new THREE.Vector3(
    Math.sin(i * 0.1) * 2,
    0.02,
    -i * 1.5
  ));
}
const pathCurve = new THREE.CatmullRomCurve3(pathPoints);
const pathGeo = new THREE.TubeGeometry(pathCurve, 200, 0.3, 8, false);
const pathMat = new THREE.MeshStandardMaterial({
  color: 0x2a1520, roughness:0.8, metalness:0.1,
  emissive: 0x110808, emissiveIntensity:0.2,
});
const pathMesh = new THREE.Mesh(pathGeo, pathMat);
scene.add(pathMesh);

// Path glow edges
const pathGlowGeo = new THREE.TubeGeometry(pathCurve, 200, 0.5, 8, false);
const pathGlowMat = new THREE.MeshBasicMaterial({
  color: 0xff6090, transparent:true, opacity:0.04,
});
scene.add(new THREE.Mesh(pathGlowGeo, pathGlowMat));

/* ══════════════════════════════════════════
   FLOATING PETALS (GPU particles)
   ══════════════════════════════════════════ */
const PETAL_COUNT = 3000;
const petalGeo = new THREE.BufferGeometry();
const petalPositions = new Float32Array(PETAL_COUNT * 3);
const petalVelocities = new Float32Array(PETAL_COUNT * 3);
const petalSizes = new Float32Array(PETAL_COUNT);
const petalColors = new Float32Array(PETAL_COUNT * 3);
const petalPhases = new Float32Array(PETAL_COUNT);

const petalPalette = [
  new THREE.Color(0xffb7c5),
  new THREE.Color(0xff91a4),
  new THREE.Color(0xffc0cb),
  new THREE.Color(0xff69b4),
  new THREE.Color(0xffd1dc),
  new THREE.Color(0xffe4e1),
];

for (let i = 0; i < PETAL_COUNT; i++) {
  const i3 = i * 3;
  petalPositions[i3] = (Math.random()-0.5) * 40;
  petalPositions[i3+1] = Math.random() * 20;
  petalPositions[i3+2] = Math.random() * -80;
  petalVelocities[i3] = (Math.random()-0.5) * 0.02;
  petalVelocities[i3+1] = -0.01 - Math.random() * 0.02;
  petalVelocities[i3+2] = (Math.random()-0.5) * 0.01;
  petalSizes[i] = 3 + Math.random() * 5;
  petalPhases[i] = Math.random() * Math.PI * 2;
  const c = petalPalette[Math.floor(Math.random()*petalPalette.length)];
  petalColors[i3] = c.r;
  petalColors[i3+1] = c.g;
  petalColors[i3+2] = c.b;
}
petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPositions, 3));
petalGeo.setAttribute('size', new THREE.BufferAttribute(petalSizes, 1));
petalGeo.setAttribute('color', new THREE.BufferAttribute(petalColors, 3));

const petalVertexShader = `
  attribute float size;
  attribute vec3 color;
  varying vec3 vColor;
  varying float vAlpha;
  void main(){
    vColor = color;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (200.0 / -mv.z);
    gl_Position = projectionMatrix * mv;
    vAlpha = smoothstep(80.0, 10.0, -mv.z);
  }
`;
const petalFragmentShader = `
  varying vec3 vColor;
  varying float vAlpha;
  void main(){
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if(d > 0.5) discard;
    float alpha = smoothstep(0.5, 0.1, d) * vAlpha * 0.7;
    gl_FragColor = vec4(vColor, alpha);
  }
`;
const petalMat = new THREE.ShaderMaterial({
  vertexShader: petalVertexShader,
  fragmentShader: petalFragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const petalSystem = new THREE.Points(petalGeo, petalMat);
scene.add(petalSystem);

/* ══════════════════════════════════════════
   FIREFLIES
   ══════════════════════════════════════════ */
const FIREFLY_COUNT = 150;
const ffGeo = new THREE.BufferGeometry();
const ffPos = new Float32Array(FIREFLY_COUNT * 3);
const ffSizes = new Float32Array(FIREFLY_COUNT);
const ffPhases = new Float32Array(FIREFLY_COUNT);
for (let i = 0; i < FIREFLY_COUNT; i++) {
  ffPos[i*3] = (Math.random()-0.5)*30;
  ffPos[i*3+1] = 1 + Math.random()*8;
  ffPos[i*3+2] = Math.random()*-70;
  ffSizes[i] = 2 + Math.random()*3;
  ffPhases[i] = Math.random()*Math.PI*2;
}
ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
ffGeo.setAttribute('size', new THREE.BufferAttribute(ffSizes, 1));
const ffVertexShader = `
  attribute float size;
  varying float vAlpha;
  uniform float uTime;
  void main(){
    vec3 p = position;
    p.x += sin(uTime*0.5 + position.z*0.3)*0.5;
    p.y += sin(uTime*0.7 + position.x*0.2)*0.3;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_PointSize = size * (150.0 / -mv.z);
    gl_Position = projectionMatrix * mv;
    float flicker = sin(uTime*3.0 + position.x*10.0)*0.5+0.5;
    vAlpha = flicker * smoothstep(60.0, 5.0, -mv.z) * 0.8;
  }
`;
const ffFragmentShader = `
  varying float vAlpha;
  void main(){
    float d = length(gl_PointCoord - 0.5);
    if(d > 0.5) discard;
    float glow = exp(-d*6.0);
    vec3 color = mix(vec3(1.0,0.9,0.5), vec3(0.5,1.0,0.7), glow);
    gl_FragColor = vec4(color, glow * vAlpha);
  }
`;
const ffMat = new THREE.ShaderMaterial({
  vertexShader: ffVertexShader,
  fragmentShader: ffFragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value:0 } },
});
scene.add(new THREE.Points(ffGeo, ffMat));

/* ══════════════════════════════════════════
   STARS
   ══════════════════════════════════════════ */
const STAR_COUNT = 500;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.random() * Math.PI * 0.4;
  const r = 60 + Math.random() * 30;
  starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = r * Math.cos(phi) + 10;
  starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta) - 30;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:0.15, transparent:true, opacity:0.6 });
scene.add(new THREE.Points(starGeo, starMat));

/* ══════════════════════════════════════════
   LANTERNS (paper lanterns along the path)
   ══════════════════════════════════════════ */
function createLantern(x, y, z) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  // Lantern body
  const bodyGeo = new THREE.CylinderGeometry(0.15, 0.25, 0.6, 8);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xff4444, emissive: 0xff2200, emissiveIntensity: 0.3,
    transparent: true, opacity: 0.8, roughness: 0.6,
  });
  group.add(new THREE.Mesh(bodyGeo, bodyMat));

  // Top ring
  const ringGeo = new THREE.TorusGeometry(0.12, 0.02, 8, 16);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0xaa8833, metalness: 0.8 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y = 0.3;
  group.add(ring);

  // Point light inside
  const light = new THREE.PointLight(0xff6622, 0.8, 8);
  light.position.y = 0;
  group.add(light);

  scene.add(group);
  return group;
}
const lanterns = [];
for (let i = 0; i < 15; i++) {
  const side = i % 2 === 0 ? -1 : 1;
  const lz = -i * 5 - 3;
  const lx = side * (2 + Math.random()) + Math.sin(lz*0.1)*1.5;
  lanterns.push(createLantern(lx, 2.5 + Math.random()*0.5, lz));
}

/* ══════════════════════════════════════════
   SCROLL LOGIC
   ══════════════════════════════════════════ */
document.getElementById('scroll-container').style.height = TOTAL_HEIGHT + 'px';

const scrollState = { progress:0, currentSection:0 };
function updateScroll() {
  const scrollTop = window.scrollY;
  const maxScroll = TOTAL_HEIGHT - window.innerHeight;
  scrollState.progress = Math.max(0, Math.min(1, scrollTop / maxScroll));
  scrollState.currentSection = Math.floor(scrollTop / SECTION_HEIGHT);
}

/* ══════════════════════════════════════════
   CAMERA PATH
   ══════════════════════════════════════════ */
const cameraPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 3, 12),
  new THREE.Vector3(-1, 3.5, 5),
  new THREE.Vector3(1, 4, -5),
  new THREE.Vector3(-0.5, 3, -15),
  new THREE.Vector3(0.5, 4.5, -25),
  new THREE.Vector3(-1, 3.5, -35),
  new THREE.Vector3(0, 5, -45),
  new THREE.Vector3(0.5, 3.5, -55),
  new THREE.Vector3(-0.5, 4, -65),
  new THREE.Vector3(0, 5, -75),
]);

/* ══════════════════════════════════════════
   UI UPDATES
   ══════════════════════════════════════════ */
const uiPhase = document.getElementById('ui-phase');
const uiProgress = document.getElementById('ui-progress');
const uiDesc = document.getElementById('ui-desc');
const centerText = document.getElementById('center-text');
const ctMain = document.getElementById('ct-main');
const ctSub = document.getElementById('ct-sub');
const ctEn = document.getElementById('ct-en');
const scrollHint = document.getElementById('scroll-hint');

let lastSection = -1;
let textVisible = false;
let textTimeout = null;

function updateUI() {
  const p = scrollState.progress;
  const sec = scrollState.currentSection;
  const pct = Math.round(p * 100);

  uiProgress.textContent = pct + '%';

  if (sec !== lastSection && sec < SECTIONS.length) {
    lastSection = sec;
    const s = SECTIONS[sec];
    uiPhase.textContent = s.phase;
    uiDesc.textContent = s.desc;

    // Show center text with animation
    centerText.classList.remove('show');
    clearTimeout(textTimeout);
    textTimeout = setTimeout(() => {
      ctMain.textContent = s.title + '，' + s.sub;
      ctSub.textContent = s.desc;
      ctEn.textContent = s.en;
      centerText.classList.add('show');
    }, 300);
  }

  // Hide scroll hint after scrolling
  if (p > 0.02) {
    scrollHint.style.opacity = Math.max(0, 1 - p * 20);
  }
}

/* ══════════════════════════════════════════
   CURSOR PETAL TRAIL
   ══════════════════════════════════════════ */
let lastTrailTime = 0;
document.addEventListener('mousemove', (e) => {
  const now = Date.now();
  if (now - lastTrailTime < 80) return;
  lastTrailTime = now;
  const petal = document.createElement('div');
  petal.className = 'cursor-petal';
  petal.style.left = (e.clientX - 4) + 'px';
  petal.style.top = (e.clientY - 4) + 'px';
  const hue = 340 + Math.random() * 40;
  petal.style.background = `radial-gradient(ellipse, hsla(${hue},80%,80%,0.6), transparent)`;
  document.body.appendChild(petal);
  setTimeout(() => petal.remove(), 1500);
});

/* ══════════════════════════════════════════
   ANIMATION LOOP
   ══════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();
  const p = scrollState.progress;

  // Camera along path
  const camPos = cameraPath.getPointAt(p);
  const camLookAhead = cameraPath.getPointAt(Math.min(1, p + 0.03));
  camera.position.lerp(camPos, 0.05);
  const currentLookAt = new THREE.Vector3();
  camera.getWorldDirection(currentLookAt);
  const targetLookAt = camLookAhead.clone().sub(camPos).normalize();
  currentLookAt.lerp(targetLookAt, 0.05);
  camera.lookAt(camera.position.clone().add(currentLookAt.multiplyScalar(10)));

  // Animate petals
  const pp = petalGeo.attributes.position.array;
  for (let i = 0; i < PETAL_COUNT; i++) {
    const i3 = i * 3;
    pp[i3] += petalVelocities[i3] + Math.sin(t*0.5 + petalPhases[i]) * 0.005;
    pp[i3+1] += petalVelocities[i3+1];
    pp[i3+2] += petalVelocities[i3+2];

    // Reset fallen petals
    if (pp[i3+1] < -1) {
      pp[i3] = (Math.random()-0.5) * 40;
      pp[i3+1] = 15 + Math.random() * 5;
      pp[i3+2] = camera.position.z - 20 + Math.random() * -40;
    }
  }
  petalGeo.attributes.position.needsUpdate = true;

  // Animate fireflies
  ffMat.uniforms.uTime.value = t;

  // Animate lanterns
  lanterns.forEach((l, i) => {
    l.rotation.z = Math.sin(t*0.5 + i*2) * 0.05;
    l.children[2].intensity = 0.6 + Math.sin(t*2 + i*3) * 0.3; // flicker
  });

  // Animate lights
  pinkLight.intensity = 2 + Math.sin(t*0.5) * 0.5;
  pinkLight.position.x = -3 + Math.sin(t*0.3) * 2;
  warmLight.intensity = 1.5 + Math.sin(t*0.7 + 1) * 0.4;

  // Bloom intensity based on progress
  bloomPass.strength = 0.5 + p * 0.8;

  // Fog density
  scene.fog.density = 0.015 - p * 0.005;

  updateUI();
  composer.render();
}

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
const lFill = document.getElementById('l-fill');
const lPct = document.getElementById('l-pct');
let loadProgress = 0;

function simulateLoading() {
  const interval = setInterval(() => {
    loadProgress += Math.random() * 15 + 5;
    if (loadProgress >= 100) {
      loadProgress = 100;
      clearInterval(interval);
      lFill.style.width = '100%';
      lPct.textContent = '100%';
      setTimeout(() => {
        document.getElementById('loader').classList.add('hide');
      }, 500);
    } else {
      lFill.style.width = loadProgress + '%';
      lPct.textContent = Math.round(loadProgress) + '%';
    }
  }, 200);
}

window.addEventListener('scroll', updateScroll, { passive:true });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

simulateLoading();
updateScroll();
animate();
</script>
</body>
